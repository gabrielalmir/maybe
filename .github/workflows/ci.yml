name: CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
      - unlabeled
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  pull-requests: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['7.4', '8.2', '8.3', '8.4', '8.5']

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Enforce test change approval label
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const labels = context.payload.pull_request.labels.map((label) => label.name);
            const hasApprovalLabel = labels.includes('test-change');

            const files = await github.paginate(
              github.rest.pulls.listFiles,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                per_page: 100,
              }
            );

            const restricted = files
              .map((f) => f.filename)
              .filter((name) => {
                return (
                  name.startsWith('tests/') ||
                  name.startsWith('tests/fixtures/') ||
                  name === 'phpunit.xml' ||
                  name === 'phpunit.xml.dist'
                );
              });

            if (restricted.length > 0 && !hasApprovalLabel) {
              core.setFailed(
                `Test file changes require the 'test-change' label. Changed: ${restricted.join(', ')}`
              );
            }

      - name: Setup PHP
        uses: shivammathur/setup-php@2.37.2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction

      - name: Use maintained Opis Closure on modern PHP
        if: matrix.php-version != '7.4'
        run: composer update opis/closure --with-all-dependencies --prefer-dist --no-interaction

      - name: Audit dependencies
        run: composer audit --no-interaction
        env:
          COMPOSER_NO_AUDIT: 0

      - name: Lint (PHPStan)
        run: composer lint

      - name: Test (Pest)
        run: composer test

      - name: Test (Async standalone runner)
        run: composer test:async

  async-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@2.37.2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction

      - name: Use maintained Opis Closure on modern PHP
        run: composer update opis/closure --with-all-dependencies --prefer-dist --no-interaction

      - name: Audit dependencies
        run: composer audit --no-interaction
        env:
          COMPOSER_NO_AUDIT: 0

      - name: Test (Async standalone runner)
        run: composer test:async
